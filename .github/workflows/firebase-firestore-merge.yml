name: Deploy Firestore + Auth on merge
on:
  push:
    branches:
      - main

jobs:
  deploy-firestore-auth:
    name: Firestore + Auth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy firestore and auth
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SAPIENSCAMPUS_97B6A }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx -y firebase-tools@latest deploy --only firestore,auth --project sapienscampus-97b6a --non-interactive
