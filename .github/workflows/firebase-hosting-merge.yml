name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            admin/package-lock.json
            functions/package-lock.json

      - name: Install and build web
        working-directory: web
        run: npm ci && npm run build

      - name: Install and build admin
        working-directory: admin
        run: npm ci && npm run build

      - name: Install functions deps
        working-directory: functions
        run: npm ci

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SAPIENSCAMPUS_97B6A }}
          channelId: live
          projectId: sapienscampus-97b6a
          target: web

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SAPIENSCAMPUS_97B6A }}
          channelId: live
          projectId: sapienscampus-97b6a
          target: admin

      - name: Deploy functions + firestore
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SAPIENSCAMPUS_97B6A }}' > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx firebase-tools deploy --only functions,firestore --project sapienscampus-97b6a --non-interactive
